<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Apps – VJD App Studio</title>
  <meta name="description" content="Browse every Android app from VJD App Studio. Search by name or description, filter by category and sort by name or latest update.">
  <link rel="canonical" href="https://YOUR-DOMAIN.example/apps.html">
  <meta name="theme-color" content="#0a1226">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="VJD App Studio">
  <meta property="og:title" content="All Apps – VJD App Studio">
  <meta property="og:description" content="Browse every Android app from VJD App Studio.">
  <meta property="og:url" content="https://YOUR-DOMAIN.example/apps.html">
  <meta property="og:image" content="https://YOUR-DOMAIN.example/assets/images/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <script>(function(){try{var t=localStorage.getItem('vjd-theme');if(t!=='dark'&&t!=='light'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="apps" data-base="">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <h1>All Apps</h1>
        <p>Every Android application from VJD App Studio in one place. Search, filter and open any app for full details.</p>
      </div>
    </section>

    <section class="section" style="padding-top:32px" aria-label="App directory">
      <div class="container">
        <form class="filters" id="filters" role="search" aria-label="Filter apps" novalidate>
          <div class="field field--search">
            <label for="q">Search apps</label>
            <input type="search" id="q" name="q" placeholder="Search by name or description" autocomplete="off" maxlength="80">
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category"><option value="">All categories</option></select>
          </div>
          <div class="field">
            <label for="sort">Sort by</label>
            <select id="sort" name="sort">
              <option value="latest">Latest update</option>
              <option value="name-asc">Name (A–Z)</option>
              <option value="name-desc">Name (Z–A)</option>
            </select>
          </div>
          <button class="btn btn--secondary" type="button" id="clear-filters" hidden>Clear filters</button>
        </form>

        <p class="results-meta" id="results-count" aria-live="polite"></p>

        <div class="grid grid--apps" id="apps-grid" aria-busy="false">
          <div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div>
        </div>
        <noscript><p class="notice notice--warn">JavaScript is needed to search and list the apps. Please enable it to continue.</p></noscript>

        <aside class="ad-slot" data-ad-slot="apps-bottom" aria-label="Advertisement" hidden></aside>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/apps.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
